name: Analytics Production Canary

# 本番analytics取り込みパイプライン(/api/analytics/events → Supabase)の生存確認。
# PRの必須チェックではない(post-deploy canary)。default branch(main)の固定コード
# だけを実行し、PR headは一切checkoutしない。SUPABASE_SERVICE_ROLE_KEYは
# "autonomous-improvement" GitHub Environment secretからのみ取得する(このEnvironment
# のdeployment branch policyはprotected branchesのみに制限されている)。
# NEXT_PUBLIC_SUPABASE_ANON_KEYは同じEnvironmentのvariable(公開クライアントキーであり
# secretではない。pr-quality-gate.ymlに既に平文で記載されている値と同一)から取得する。
#
# 2026-07-27の初回実行がtest:analytics-production-ingestionの`npm run build`段階で
# SUPABASE_NOT_CONFIGURED(/dictionary/[word]の静的生成に必要なNEXT_PUBLIC_SUPABASE_ANON_KEY
# 未設定)により失敗したため、このEnvironment variableを追加した。
#
# ここで実行する3テストは、テストスクリプト自身が直接secretを参照していなくても、
# 起動する/api/analytics/eventsやgetAdminClient()が内部でSUPABASE_SERVICE_ROLE_KEYを
# 使って実際にDBへ書き込むため、secretを一切渡さない独立PR CI(pr-quality-gate.yml)
# では構造的に成功できない。そのためこのtrusted workflowへ集約する
# (2026-07-27、PR #18のquality-gateでtest:analytics-rejection-reasonsが
# insert_failedで落ちたことをきっかけに移設):
# - test:analytics-production-ingestion: 既知のテストイベントを本番へ送信し、
#   is_test_event=true として保存されることだけを確認する(ユーザーデータは読まない)。
# - test:analytics-rejection-reasons: bot/origin/rate_limit/invalid_event/duplicateの
#   各拒否理由コードに加え、正常系(accepted)の実際のDB insertも検証する。
# - test:test-account-exclusion: Growth OS集計からテストアカウント/テストイベントが
#   除外されていることのソースコード監査(こちらは実際にはDBアクセス不要だが、
#   analytics関連の検証として同じtrusted workflowでまとめて実行する)。
#
# - test:analytics-central-context-usage: 「isTestEvent判定はresolveAnalyticsRequestContext()
#   1か所だけを通る」ことのソースコード監査(こちらもDBアクセス不要)。PR #137の
#   オーナー指摘対応(中央集約リファクタ)で追加した。
#
# 4テストは個別のstepとして順番に実行する(continue-on-errorは付けない)。いずれかが
# 失敗すればそこでjobは失敗し、後続stepは自動的にスキップされる(無制限リトライなし)。
#
# LV_AUDIT_TOKENについて(オーナー指摘対応、2026-09-01で削除): このワークフローの
# test:analytics-production-ingestion・test:analytics-rejection-reasonsは、本番の
# Supabaseへ直接書き込む(SUPABASE_SERVICE_ROLE_KEY経由)が、x-lv-e2e-testヘッダーの
# 送信先はスクリプト自身がこのjob内で起動するローカルdevサーバー(ensureServer())
# であって、production(Vercel)にデプロイされた実アプリではない。よって検証している
# のは「監査モードの仕組み自体」であり、production用の"本物の"LV_AUDIT_TOKENとの一致
# ではないため、両スクリプトとも実行のたびに自分自身で使い捨てトークンを生成する
# よう再設計された(scripts/testing/lib/ephemeralAuditToken.mjs参照)。これにより
# このワークフローはLV_AUDIT_TOKEN secretを一切必要としない(production secretの
# 存在範囲をscripts/testing/check-prod-srs-v2-global.mjsだけへ縮小する取り組みの一環)。

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 18 * * *" # 毎日 UTC 18:00 (JST 03:00)

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: autonomous-improvement
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci

      # 値そのものは一切表示せず、環境変数が空でないことだけを確認する。
      # 不足があれば変数名だけを表示してjobを失敗させる(secretをechoしない)。
      - name: Preflight - verify required env vars are present
        run: |
          missing=""
          [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] && missing="$missing NEXT_PUBLIC_SUPABASE_URL"
          [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] && missing="$missing NEXT_PUBLIC_SUPABASE_ANON_KEY"
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "Missing required env var(s):$missing"
            exit 1
          fi
          echo "All required env vars are present (values not shown)."

      - name: Run analytics production ingestion canary
        run: npm run test:analytics-production-ingestion

      - name: Run analytics rejection reasons check
        run: npm run test:analytics-rejection-reasons

      - name: Run test-account exclusion audit
        run: npm run test:test-account-exclusion

      - name: Run analytics central context usage audit
        run: npm run test:analytics-central-context-usage
