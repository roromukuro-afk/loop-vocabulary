name: PR Quality Gate

# 独立CI(pull_requestトリガー)。Engineering Agent自身が実行したテスト結果を信用せず、
# ここで完全に独立して再検査する(AUTONOMOUS_ENGINEERING_POLICY.md参照)。
#
# secretは一切渡さない(fork PR/信頼できないコードでも安全)。permissionsも
# contents:read のみに絞る。DBへの結果反映はこのworkflowでは行わない —
# 別workflow(pr-quality-gate-reflect.yml, workflow_run トリガー、信頼コンテキスト)が
# このworkflowの結果artifactを読んでSupabaseへ反映する。
#
# forbiddenPathPatterns/selfProtectionPathPatternsへの変更の承認可否は、この
# pull_requestトリガー(PR headのコードをcheckout・実行する、信頼できないコンテキスト)
# では一切判断しない。pr-ci-checks.mjsは検出結果を情報として記録するのみで、最終承認
# 判断は base/main側だけで動く .github/workflows/protected-path-gate.yml
# (pull_request_target/issue_comment)が専任で担当する。
#
# NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY はNEXT_PUBLIC_プレフィックスの
# 規約どおりNext.jsのビルド時にクライアントバンドルへそのまま埋め込まれる値であり、
# デプロイ済みの本番サイトを見れば誰でも取得できる。secretではないため、ここに直接
# 書いてもfork PR経由の漏洩リスクは無い(SUPABASE_SERVICE_ROLE_KEY等の真のsecretとは異なる)。
# ビルド(`npm run build`)がSupabase未設定エラーで落ちないようにするために必要。

env:
  NEXT_PUBLIC_SUPABASE_URL: "https://befjjebsrnsfwhtmydiv.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJlZmpqZWJzcm5zZndodG15ZGl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1MTk2NDEsImV4cCI6MjA5ODA5NTY0MX0.M9wK6WEFTA8KduqUqfC0c9rRgKNCgOUq2FC9djkdEfU"

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-quality-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    # 2026-08-19: PR #105/#107で"Install Playwright Chromium"(npx playwright
    # install --with-deps)がapt/CDN側の一時的な詰まりで丸ごと20分ハングし、
    # ジョブ全体がtimeout-minutesで強制終了する事象を確認(5回連続含む)。
    # "Run independent quality gate checks"自体は毎回およそ16分と安定しており、
    # テストスイート自体の肥大化が原因ではない。対策としてPlaywrightブラウザの
    # actions/cacheと、インストールstep単体のtimeout+リトライを追加したうえで、
    # 通常ケース(npm ci + install + checks ≒ 17〜18.5分)に対する余裕を確保する
    # ため20→25分に緩めている(スイート増加を見込んだ緩和ではない)。
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci

      # scripts/testing/e2e/canonical-integrity.mjs(pr-ci-checks.mjsが呼ぶ独立チェックの一つ)は
      # 実際にPlaywrightでChromiumを起動する。`npm ci`はnode_modules配下のPlaywright"パッケージ"は
      # インストールするが、ブラウザバイナリ本体(chrome-headless-shell等)は別途
      # `playwright install`が必要で、これを行っていなかったため
      # "browserType.launch: Executable doesn't exist" でクラッシュしていた
      # (2026-07-20、PR #4の独立PR Quality Gate run #29729753115で発覚)。
      # Chromiumのみをインストールする(Firefox/WebKitはこのリポジトリのどのテストも使わない)。
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # インストール自体が(apt-get側の詰まりやCDNのスローダウンで)無応答のまま
      # 何十分もハングする事象があったため、1回の試行を`timeout`コマンドで
      # 打ち切ってリトライする。キャッシュヒット時はほぼ一瞬で完了する。
      - name: Install Playwright Chromium
        timeout-minutes: 8
        run: |
          for attempt in 1 2; do
            echo "::group::Playwright install attempt ${attempt}"
            if timeout 180 npx playwright install --with-deps chromium; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Playwright install attempt ${attempt} failed or hung past 3m, retrying..."
            sleep 5
          done
          echo "Playwright install failed after 2 attempts"
          exit 1

      - name: Run independent quality gate checks
        id: checks
        continue-on-error: true
        run: node scripts/improvement/pr-ci-checks.mjs --base=origin/main --out=pr-ci-result.json

      - name: Save PR metadata for the reflect workflow
        run: |
          echo '{"pr_number": ${{ github.event.pull_request.number }}, "head_sha": "${{ github.event.pull_request.head.sha }}"}' > pr-meta.json

      - uses: actions/upload-artifact@v4
        with:
          name: pr-ci-result
          path: |
            pr-ci-result.json
            pr-meta.json
          retention-days: 30

      - name: Fail the check if any gate failed
        if: steps.checks.outcome == 'failure'
        run: exit 1
